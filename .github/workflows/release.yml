# Annotated v* tags provide the release notes, as in ShareWinSelector.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "version=$($env:RELEASE_TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained single EXE
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish DotARPG.csproj -p:PublishProfile=SelfContained "-p:Version=$env:RELEASE_VERSION"
      - name: Collect EXE and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifacts/win-x64/DotARPG.exe dist/DotARPG.exe
          "{0}  DotARPG.exe" -f (Get-FileHash dist/DotARPG.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/DotARPG.exe dist/SHA256SUMS.txt --title "DotARPG $env:RELEASE_TAG" --notes-from-tag
